[project]
name = "overseer"
version = "0.1.0"
description = "OverSeer: advisory collection, normalization, and notification tool"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "cvss>=3.6",  # 3.6 confirmed to include the CVSS4 class used for v4.0 vectors
    "feedparser>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
overseer = "overseer.cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["overseer*"]

[tool.setuptools.package-data]
overseer = ["notifier/templates/*.j2"]
